<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - StudentVote</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>
    <!--Navigation-->
    <header>
        <nav class="navbar">
            <div class="logo">
                <img src="../images/OIP.png">
            </div>
            <ul class="nav-links">
                <li>
                    <a href="../index.html"> Home</a>
                </li>
                <li>
                    <a href="../index.html#about">About</a>
                </li>
            </ul>
        </nav>
    </header>

    <!--Login Section-->
    <main>
        <section class="login-section">
            <div class="login-container">
                <h1>Student Login</h1>
                <p class="login-description">
                    Login to access the student voting portal
                </p>

                <!--Login Form-->
                <form id="loginForm">
                    <!--Student ID-->
                    <div class="form-group">
                        <label for="studentId">
                            Student ID
                        </label>
                        <input type="text" id="studentId" name="studentId" placeholder="Enter your student ID">
                        <small id="studentIdError"></small>
                    </div>
                    <!--Password-->
                    <div class="form-group">
                        <label for="password">
                            Password
                        </label>
                        <input type="password" id="password" name="password" placeholder="Enter your password">
                        <small id="passwordError"></small>
                    </div>
                    <!--Remember Me-->
                    <div class="remember">
                        <input type="checkbox" id="remember">
                        <label for="remember">Remember Me</label>
                    </div>
                    <!--Login Button-->
                    <button type="submit" class="login-btn">
                        Login
                    </button>
                    <!--General Error-->
                    <p id="loginMessage"></p>
                </form>

            </div>
        </section>
    </main>
    <!--Footer-->
    <footer>
        <p>
            &copy; 2026 Student Online Voting Platform
        </p>
    </footer>
    <script src="../js/script.js"></script>
</body>

</html>
